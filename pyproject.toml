[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "selfagent"
version = "0.1.0"
description = "Мультиагентная система контролируемого самоулучшения репозитория"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-ai-slim[openai]>=2.51,<3",
    "pydantic-ai-harness[coder,skills]>=0.67,<1",
    "httpx2>=2.13,<3",
    "loguru>=0.7,<1",
    "pydantic-settings>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "black>=26.3,<27",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
]

[project.scripts]
selfagent = "selfagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
